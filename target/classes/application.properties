# ============================================================
#  APPLICATION
# ============================================================
spring.application.name=order-tracking-system
server.port=8080

# ============================================================
#  POSTGRESQL  (system of record - permanent order history)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ordertracking
spring.datasource.username=tracker
spring.datasource.password=tracker123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25

# ============================================================
#  REDIS  (cache + TTL keys + Streams + Pub/Sub)
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.shutdown-timeout=100ms

# ============================================================
#  APP-SPECIFIC KEYS / CHANNELS / TTLs
# ============================================================
app.redis.stream.key=order-events-stream
app.redis.stream.group=order-processors
app.redis.stream.dlq-key=order-events-dlq
app.redis.stream.max-length=50000

app.redis.channel.order-status=order.status.updates
app.redis.channel.rider-location=rider.location.updates

app.cache.order-ttl-seconds=300
app.rider.location-ttl-seconds=30
app.rider.trail-size=100

# ============================================================
#  LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.tracker.ordertracking=DEBUG
logging.level.org.springframework.web.socket=INFO

management.endpoints.web.exposure.include=health,info,metrics
